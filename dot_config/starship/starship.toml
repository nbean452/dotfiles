"$schema" = "https://starship.rs/config-schema.json"

format = """
$username\
$hostname\
$directory\
$git_branch\
$localip\
$cmd_duration\
$line_break\
$character"""

[username]
style_user = "white bold"
style_root = "black bold"
format = "[$user]($style)"
disabled = false
show_always = true

[hostname]
ssh_only = false
format = "[$ssh_symbol](bold blue italic)"
ssh_symbol="-sshed"
disabled = false

[directory]
format = "[ $path]($style)"
style = "blue"
truncate_to_repo = false
truncation_length = 3
truncation_symbol = "…/"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[ $branch]($style)"
style = "#769ff0"

[cmd_duration]
format = "([ $duration]($style))"
style = "yellow"
min_time = 0
show_milliseconds = true
show_notifications = true
min_time_to_notify = 10_000_000

[localip]
ssh_only = false
format = "( @[$localipv4](bold red))"
disabled = false
